name: Release

# Pushing a tag runs the checks, builds a signed release APK and publishes it as a GitHub
# release. Two kinds of tag are accepted:
#   vX.Y.Z                 a final release. The tagged commit must be on main.
#   vX.Y.Z-rc.N / -beta.N  a pre-release, published as a GitHub pre-release. It may come from any
#                          branch, so a change can be test-built before it is merged.
# The version comes from the tag alone (scripts/release-version.sh): versionName is the tag
# without the v, and versionCode rises from beta to rc to final, so there is no bump commit.
# See docs/releasing.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

env:
  # The signing certificate every release must carry, so installs keep updating in place.
  EXPECTED_CERT_SHA256: 196087509cb33a1a2457a8960fa9cd30a85cb3ebb24747b4d0708dff980ece5b

jobs:
  release:
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, not at repository level, and the environment
    # needs the owner's approval before the job starts. A tag can come from any commit, and a
    # commit can edit this very file, so dropping the line would only leave the job without the
    # secrets. See docs/releasing.md.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the version from the tag
        id: version
        run: |
          # On a bad tag the script prints a ::error:: annotation, which must reach the log, not
          # $GITHUB_OUTPUT.
          if ! out=$(scripts/release-version.sh "$GITHUB_REF_NAME"); then
            echo "$out"
            exit 1
          fi
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$out" | tr '\n' ' '
          echo

      - name: Require a final release to be on main
        if: steps.version.outputs.prerelease == 'false'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Release only from main."
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint and unit tests
        run: ./gradlew lint test

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # -P overrides the defaults in gradle.properties, which app/build.gradle.kts reads.
        run: ./gradlew assembleRelease -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify the APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          built=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$built" ]]; then
            echo "::error::$built was not produced (an unsigned build is named app-release-unsigned.apk)"
            exit 1
          fi

          cert=$("$bt/apksigner" verify --print-certs "$built" | sed -nE 's/.*certificate SHA-256 digest: //p' | head -1)
          if [[ "$cert" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Signing certificate $cert is not the expected $EXPECTED_CERT_SHA256"
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$built")
          code=$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$badging" | head -1)
          name_in_apk=$(sed -nE "s/.*versionName='([^']*)'.*/\1/p" <<<"$badging" | head -1)
          if [[ "$code" != "$EXPECTED_CODE" || "$name_in_apk" != "$VERSION_NAME" ]]; then
            echo "::error::APK is $name_in_apk ($code), expected $VERSION_NAME ($EXPECTED_CODE)"
            exit 1
          fi

          # An update only installs if its versionCode is higher than the previous release's. A
          # final is compared with the latest final, a pre-release with the latest of any kind.
          # An empty result (no earlier release) skips the check.
          if [[ "$PRERELEASE" == true ]]; then
            prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          else
            prev_tag=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || true)
          fi
          if [[ -n "$prev_tag" ]]; then
            mkdir "$RUNNER_TEMP/prev"
            gh release download "$prev_tag" --pattern '*.apk' --dir "$RUNNER_TEMP/prev"
            prev_code=$("$bt/aapt2" dump badging "$RUNNER_TEMP"/prev/*.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)
            if (( code <= prev_code )); then
              echo "::error::versionCode $code is not greater than $prev_tag's $prev_code"
              exit 1
            fi
          fi

          name="jtmpo-$VERSION_NAME.apk"
          mkdir release
          cp "$built" "release/$name"
          (cd release && sha256sum "$name" > SHA256SUMS)
          echo "sha=$(cut -d' ' -f1 release/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          kind=Release
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=Pre-release
            flags+=(--prerelease)
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $kind jtmpo $VERSION_NAME (versionCode $VERSION_CODE), built from commit \`$GITHUB_SHA\`.

          - Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`
          - APK SHA-256: \`$APK_SHA\`

          Install \`jtmpo-$VERSION_NAME.apk\` on the phone; it updates in place over any earlier release.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "jtmpo $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${flags[@]}"
