name: Release

# Pushing a tag like v0.2.1 runs the checks, builds a signed release APK and publishes it as a
# GitHub release. The tag must match VERSION_NAME in gradle.properties, and the tagged commit must
# be on main. versionCode comes from VERSION_CODE in gradle.properties (`task set-version` bumps
# it). See docs/releasing.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  # The signing certificate every release must carry, so installs keep updating in place.
  EXPECTED_CERT_SHA256: 196087509cb33a1a2457a8960fa9cd30a85cb3ebb24747b4d0708dff980ece5b

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the repo
        id: version
        run: |
          name=$(sed -nE 's/^VERSION_NAME=(.*)$/\1/p' gradle.properties)
          code=$(sed -nE 's/^VERSION_CODE=([0-9]+)$/\1/p' gradle.properties)
          if [[ -z "$name" || -z "$code" ]]; then
            echo "::error::Could not read VERSION_NAME and VERSION_CODE from gradle.properties"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME $name in gradle.properties"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Release only from main."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName $name, versionCode $code"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint and unit tests
        run: ./gradlew lint test

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        # The version comes from gradle.properties, which the previous step already checked against the tag.
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify the APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          built=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$built" ]]; then
            echo "::error::$built was not produced (an unsigned build is named app-release-unsigned.apk)"
            exit 1
          fi

          cert=$("$bt/apksigner" verify --print-certs "$built" | sed -nE 's/.*certificate SHA-256 digest: //p' | head -1)
          if [[ "$cert" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Signing certificate $cert is not the expected $EXPECTED_CERT_SHA256"
            exit 1
          fi

          code=$("$bt/aapt2" dump badging "$built" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)
          if [[ "$code" != "$EXPECTED_CODE" ]]; then
            echo "::error::APK versionCode $code is not the expected $EXPECTED_CODE"
            exit 1
          fi

          # An update only installs if its versionCode is higher than the last release's.
          prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [[ -n "$prev_tag" ]]; then
            mkdir "$RUNNER_TEMP/prev"
            gh release download "$prev_tag" --pattern '*.apk' --dir "$RUNNER_TEMP/prev"
            prev_code=$("$bt/aapt2" dump badging "$RUNNER_TEMP"/prev/*.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)
            if (( code <= prev_code )); then
              echo "::error::versionCode $code is not greater than $prev_tag's $prev_code"
              exit 1
            fi
          fi

          name="jtmpo-$VERSION_NAME.apk"
          mkdir release
          cp "$built" "release/$name"
          (cd release && sha256sum "$name" > SHA256SUMS)
          echo "sha=$(cut -d' ' -f1 release/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          jtmpo $VERSION_NAME (versionCode $VERSION_CODE), built from commit \`$GITHUB_SHA\`.

          - Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`
          - APK SHA-256: \`$APK_SHA\`

          Install \`jtmpo-$VERSION_NAME.apk\` on the phone; it updates in place over any earlier release.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "jtmpo $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
